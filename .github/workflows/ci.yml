name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: none

      # The lock file is resolved for PHP 8.2 (config.platform), so it installs
      # as-is across the whole matrix and the advertised range is really tested.
      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHP-CS-Fixer (PSR-12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan (level 9)
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit and coverage floor
        run: |
          vendor/bin/phpunit --coverage-clover var/clover.xml
          php scripts/coverage-check.php var/clover.xml 90
